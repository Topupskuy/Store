<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta content="width=550px,width-scale=550px" name="viewport">

  <title>TOPUPSKUY - APP PREMIUM, TOPUP GAME, EWALLET, AND MORE!!</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://topupskuy.github.io">
  <meta property="og:title" content="TOPUPSKUY - App Premium, Topup Game, eWallet, dan Lainnya!">
  <meta property="og:description" content="Topup cepat & murah untuk game, eWallet, hingga layanan app premium. Mudah, aman, 24/7.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Tskuy/Save/refs/heads/main/.github/workflows/headerskuy.png">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    /* =========================================================
       BACKGROUND ADS
       Dua unit iklan langsung dimuat ketika halaman dibuka.
       Tidak ada lagi iframe 1 / iframe 2.
    ========================================================= */

    #mainWrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      overflow: hidden;
      background: #0b0b0b;
    }

    .ad-slot {
      position: relative;
      min-height: 0;
      width: 100%;
      overflow: auto;
      display: grid;
      place-items: center;
      align-content: center;
      background: #ffffff;
      isolation: isolate;
    }

    .ad-inner {
      width: 100%;
      min-height: 90px;
      display: grid;
      place-items: center;
    }

    /* =========================================================
       FULLSCREEN POPUP
    ========================================================= */

    #popupWrap {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: .5px;
    }

    #popupFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #aaa;
      display: block;
    }

    /* =========================================================
       SNOW FX
    ========================================================= */

    #fxCanvas,
    #pileCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
    }

    @media (prefers-reduced-motion: reduce) {
      #fxCanvas,
      #pileCanvas {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- SNOW FX -->
  <canvas id="pileCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <!-- =======================================================
       BACKGROUND ADS
       Tidak ada iframe sumber lagi.
  ======================================================== -->
  <main id="mainWrap">

    <!-- IKLAN 1 -->
    <section class="ad-slot" id="adSlot1" aria-label="Iklan 1">
      <div class="ad-inner">
        <script
          async="async"
          data-cfasync="false"
          src="https://pl30814783.effectivecpmnetwork.com/8bf152dbe40c9dd67fc871d3792b8f34/invoke.js">
        </script>

        <div id="container-8bf152dbe40c9dd67fc871d3792b8f34"></div>
      </div>
    </section>

    <!-- IKLAN 2 -->
    <section class="ad-slot" id="adSlot2" aria-label="Iklan 2">
      <div class="ad-inner">
        <script
          async="async"
          data-cfasync="false"
          src="https://pl30814815.effectivecpmnetwork.com/97f9357130ae32b8c013e028ef88278f/invoke.js">
        </script>

        <div id="container-97f9357130ae32b8c013e028ef88278f"></div>
      </div>
    </section>

  </main>

  <!-- =======================================================
       VISIBLE PAGE / FULLSCREEN SPECIAL
  ======================================================== -->
  <div id="popupWrap">
    <iframe
      id="popupFrame"
      src="https://tskuy.github.io/Special/"
      title="TOPUPSKUY Special"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script>
    (function () {
      "use strict";

      /* =====================================================
         OPTIONAL INTERACTION HOOK
         -----------------------------------------------------
         Klik yang terjadi di dalam iframe Special tidak dapat
         dibaca langsung oleh halaman parent jika berbeda origin.

         Jika halaman Special milik kamu ingin mengirim event
         ke parent, gunakan postMessage dari halaman Special:

         window.parent.postMessage(
           { type: "TOPUPSKUY_INTERACTION" },
           "https://topupskuy.github.io"
         );

         Handler di bawah hanya menerima event tersebut.
         Tidak melakukan reload iklan secara paksa.
      ====================================================== */

      window.addEventListener("message", function (event) {
        if (event.origin !== "https://tskuy.github.io") return;

        if (
          event.data &&
          typeof event.data === "object" &&
          event.data.type === "TOPUPSKUY_INTERACTION"
        ) {
          console.info("TOPUPSKUY interaction received.");
        }
      });

      /* =====================================================
         SNOW FX
      ====================================================== */

      function startSnow() {
        const fx = document.getElementById("fxCanvas");
        const pile = document.getElementById("pileCanvas");

        if (!fx || !pile) return;

        const ctxFx = fx.getContext("2d");
        const ctxPile = pile.getContext("2d");

        let flakes = [];
        let running = true;
        let rafId = null;

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const width = window.innerWidth;
          const height = window.innerHeight;

          fx.width = Math.floor(width * dpr);
          fx.height = Math.floor(height * dpr);
          pile.width = Math.floor(width * dpr);
          pile.height = Math.floor(height * dpr);

          fx.style.width = width + "px";
          fx.style.height = height + "px";
          pile.style.width = width + "px";
          pile.style.height = height + "px";

          ctxFx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctxPile.setTransform(dpr, 0, 0, dpr, 0, 0);

          const amount = window.innerWidth <= 600 ? 70 : 120;

          flakes = Array.from({ length: amount }, function () {
            return {
              x: Math.random() * width,
              y: Math.random() * height,
              r: Math.random() * 2 + 1,
              v: Math.random() * 0.5 + 0.2,
              drift: Math.random() * 0.25 - 0.125,
              alpha: Math.random() * 0.45 + 0.45
            };
          });
        }

        function tick() {
          if (!running) return;

          ctxFx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          for (let i = 0; i < flakes.length; i++) {
            const f = flakes[i];

            ctxFx.beginPath();
            ctxFx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctxFx.fillStyle = "rgba(255,255,255," + f.alpha + ")";
            ctxFx.fill();

            f.y += f.v;
            f.x += f.drift;

            if (f.y > window.innerHeight + 5) {
              f.y = -5;
              f.x = Math.random() * window.innerWidth;
            }

            if (f.x < -5) {
              f.x = window.innerWidth + 5;
            }

            if (f.x > window.innerWidth + 5) {
              f.x = -5;
            }
          }

          rafId = requestAnimationFrame(tick);
        }

        window.addEventListener("resize", resize, { passive: true });

        document.addEventListener("visibilitychange", function () {
          running = !document.hidden;

          if (!running && rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }

          if (running && !rafId) {
            tick();
          }
        });

        resize();
        tick();
      }

      window.addEventListener("load", function () {
        startSnow();
      });

    })();
  </script>

</body>
</html>
